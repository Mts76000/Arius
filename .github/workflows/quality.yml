name: Quality

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Export OpenAPI
        run: npm run openapi:export

      - name: Check OpenAPI export
        run: git diff --exit-code ../shared/openapi.json

      - name: Test
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo dependencies
        run: pnpm expo install --check

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate --ignore-unfixable

      - name: Lint
        run: pnpm lint

      - name: Generate OpenAPI types
        run: pnpm types:api

      - name: Check generated API types
        run: git diff --exit-code ../shared/openapi.json shared/openapiTypes.ts

      - name: Test
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E browser test
        run: pnpm test:e2e

  deploy:
    name: Deploy Coolify
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy backend
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_BACKEND_WEBHOOK"
        env:
          COOLIFY_BACKEND_WEBHOOK: ${{ secrets.COOLIFY_BACKEND_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

      - name: Deploy frontend
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_FRONTEND_WEBHOOK"
        env:
          COOLIFY_FRONTEND_WEBHOOK: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
